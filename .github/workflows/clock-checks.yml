name: Clock checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update the Mooncakes index
        run: moon update
      - name: Verify the portable calibration API
        run: |
          moon check --deny-warn
          moon test --deny-warn
      - name: Verify the Node CLI
        run: |
          moon check --target js --deny-warn
          moon test --target js --deny-warn
          moon build console --target js --release
      - name: Assert the capture replay results
        run: moon run captures/verify-bench.mbtx --deny-warn
      - name: Check formatting
        run: moon fmt --check
